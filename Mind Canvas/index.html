<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mind Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="shortcut icon" href="Favicon/tf.jpg" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white">
  <div class="flex flex-col md:flex-row min-h-screen">
    <div class="w-full md:w-1/4 bg-gray-800 p-4 space-y-4">
      <h1 class="text-2xl font-bold mb-4"><i class="fa-solid fa-brush"></i> Mind Canvas</h1>
      <label class="block mb-2">Brush Color</label>
      <input type="color" id="colorPicker" class="w-full h-10 mb-4" />

      <label class="block mb-2">Brush Size</label>
      <input type="range" id="brushSize" min="1" max="50" value="5" class="w-full mb-4" />

      <label class="block mb-2">Pen Type</label>
      <select id="penType" class="w-full px-4 py-2 rounded mb-4">
        <option value="normal">Normal</option>
        <option value="glow">Glow</option>
        <option value="rainbow">Rainbow</option>
      </select>

      <button id="toggleEraser" class="bg-yellow-500 hover:bg-yellow-600 text-black px-4 py-2 rounded mb-2 w-full">Toggle Eraser</button>
      <div class="flex gap-2">
        <button id="undo" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded w-full">Undo</button>
        <button id="redo" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded w-full">Redo</button>
      </div>

      <div class="flex gap-2 mt-2">
        <button id="clear" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded w-full">Clear</button>
        <button id="download" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded w-full">Download</button>
      </div>

      <div class="mt-4">
        <label class="block mb-2">Layers</label>
        <div id="layerList" class="space-y-2"></div>
        <button id="addLayer" class="mt-2 bg-purple-600 hover:bg-purple-700 w-full px-4 py-2 rounded">+ Add Layer</button>
      </div>

      <button id="toggleSymmetry" class="mt-4 bg-pink-600 hover:bg-pink-700 w-full px-4 py-2 rounded">Symmetry: OFF</button>
    </div>
    <div class="w-full md:w-3/4 relative">
      <div id="canvasContainer" class="relative w-full h-screen"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
