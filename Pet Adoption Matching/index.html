<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Md. Tasnim Ferdous">
  <title>Pet Adoption Matching</title>
  <link rel="shortcut icon" href="Favicon/tf.jpg">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body>
  <div class="navbar">
    <a href="index.html" class="logo"><h1><i class="fas fa-paw"></i> Pet Adoption Matching</h1></a>
    <input type="checkbox" id="check">
    <label for="check" class="icons">
        <i class="fa-solid fa-bars menu"></i>
        <i class="fa-solid fa-xmark close"></i>
    </label>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <div class="container home-container">
    <div class="card">
      <h2>Find Your Pet Match</h2>
      <div class="selector">
        <label for="personality">Select Your Personality:</label>
        <select id="personality">
            <option value="Active">Active</option>
            <option value="Calm">Calm</option>
            <option value="Friendly">Friendly</option>
            <option value="Protective">Protective</option>
            <option value="Playful">Playful</option>
        </select>
        <br class="divider" id="card-br">
        <label for="petType">Select Pet Type:</label>
        <select id="petType">
            <option value="All">All</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Rabbit">Rabbit</option>
        </select>
      </div>  
      <button id="matchButton"><i class="fas fa-paw"></i> Find My Match</button>
    </div>

    <div id="petCards" class="pet-cards"></div>
  </div>

  <footer>
    <p>&copy; 2025 Pet Adoption Matching.<br class="divider" id="footer-br"> All rights reserved.</p>

        <a href="https://www.linkedin.com/in/md-tasnimferdous/"><i class="fa-brands fa-linkedin"></i></a>
        <a href="https://www.facebook.com/tasnim.ferdous.arnob/"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.instagram.com/_tasnim_ferdous_/"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://github.com/Tasnim-Ferdous"><i class="fa-brands fa-github"></i></a>
        <a href="mailto:tasnimferdous2007@gmail.com"><i class="fa-regular fa-envelope"></i></a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
